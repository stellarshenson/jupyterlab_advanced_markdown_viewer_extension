[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_advanced_markdown_viewer_extension"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    "watchdog>=4,<7",
    # The Markdown family this extension is built to work beside: installing it
    # installs them, so a reader gets the whole set in one command. Each floor
    # is the version that sibling was published at when the family was surveyed
    # on 2026-09-13, not a minimum any behaviour here was proved against.
    "jupyterlab_colourful_tab_extension>=1.1.21",
    "jupyterlab_edit_markdown_at_content_extension>=1.0.24",
    "jupyterlab_export_markdown_extension>=1.6.28",
    "jupyterlab_github_markdown_alerts_extension>=1.0.25",
    "jupyterlab_markdown_insert_content_extension>=1.1.28",
    "jupyterlab_markdown_switch_tab_scrolling_fix>=1.0.18",
    "jupyterlab_markdown_syntax_rendering_fix>=1.0.2",
    "jupyterlab_markdown_viewer_toc_fix>=1.0.15",
    "jupyterlab_paste_content_as_markdown_extension>=1.0.8",
    "jupyterlab_refresh_view_extension>=1.2.33"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.2.0",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_advanced_markdown_viewer_extension/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_advanced_markdown_viewer_extension/labextension" = "share/jupyter/labextensions/jupyterlab_advanced_markdown_viewer_extension"
"install.json" = "share/jupyter/labextensions/jupyterlab_advanced_markdown_viewer_extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_advanced_markdown_viewer_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_advanced_markdown_viewer_extension/labextension/static/style.js",
    "jupyterlab_advanced_markdown_viewer_extension/labextension/package.json",
]
skip-if-exists = ["jupyterlab_advanced_markdown_viewer_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_advanced_markdown_viewer_extension/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
